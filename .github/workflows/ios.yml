name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create iOS project
        run: flutter create --platforms=ios --project-name lumora --org com.lumora .

      - name: Permissions in Info.plist
        run: |
          P=ios/Runner/Info.plist
          PB=/usr/libexec/PlistBuddy
          add() { $PB -c "Add :$1 $2 $3" "$P" 2>/dev/null || $PB -c "Set :$1 $3" "$P" 2>/dev/null || true; }
          add CFBundleDisplayName string "Lumora"
          add NSMicrophoneUsageDescription string "Lumora uses the microphone for voice input."
          add NSSpeechRecognitionUsageDescription string "Lumora uses speech recognition for voice input."
          add NSPhotoLibraryUsageDescription string "Lumora needs photo access to attach images."
          add NSCameraUsageDescription string "Lumora needs the camera to attach photos."
          $PB -c "Add :NSAppTransportSecurity dict" "$P" 2>/dev/null || true
          $PB -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$P" 2>/dev/null || true

      - name: Get packages
        run: flutter pub get

      - name: App icon (optional)
        continue-on-error: true
        run: |
          printf 'flutter_launcher_icons:\n  ios: true\n  android: false\n  image_path: "assets/icon.png"\n  remove_alpha_ios: true\n' > icons_ios.yaml
          dart run flutter_launcher_icons -f icons_ios.yaml

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Make IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ios/iphoneos/Runner.app build/Payload/
          cd build && zip -qry Lumora.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Lumora-ios-unsigned
          path: build/Lumora.ipa
          if-no-files-found: error
